# The image publishes as ghcr.io/<owner>/<repository> and the bundle as
# ghcr.io/<owner>/<repository>-kustomize, both taken from the repository this
# runs in, so a generated repository publishes under its own name from its
# first push. The bundle stamps that image into config/base, so rename
# ghcr.io/example-org/example-service under config/ to match.
#
# The publish jobs are skipped in the template repository itself, where they
# would push artifacts nobody consumes.

name: Build and Publish Docker Image

on:
  push:
  release:
    types: ["published"]

jobs:
  validate-kustomize:
    uses: datum-cloud/actions/.github/workflows/validate-kustomize.yaml@v1.26.0

  publish-container-image:
    # No point in trying to build the container image if the deployment
    # manifests are invalid.
    needs:
      - validate-kustomize
    if: github.repository != 'datum-cloud/service-template'
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.26.0
    with:
      image-name: ${{ github.event.repository.name }}
      registry-organization: ${{ github.repository_owner }}
    secrets: inherit

  publish-kustomize-bundles:
    # Ensure the kustomize manifests are valid and the container is published
    # before we publish the kustomize manifests. We expect publishing the
    # kustomize manifests to result in new deployments going out.
    needs:
      - validate-kustomize
      - publish-container-image
    if: github.repository != 'datum-cloud/service-template'
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.26.0
    with:
      bundle-name: ghcr.io/${{ github.repository }}-kustomize
      bundle-path: config
      image-overlays: config/base
      image-name: ghcr.io/${{ github.repository }}
    secrets: inherit
